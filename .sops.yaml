# Who can decrypt hosts/maxnix/secrets.yaml. See hosts/maxnix/secrets.nix.
#
# Public keys only, and all three are post-quantum hybrid (age1pq1…): the
# encrypted file is public for good, so it has to hold up against whatever
# can break X25519 later. Each private half lives in 1Password; the machines
# get theirs restored onto disk, never generated there.
#
#   admin  edits secrets — sops on any machine, key fetched from 1Password
#   vm     the build-vm guest, key at /home/.maxnix/sops-age.key
#   metal  the real laptop, key at /persist/sops/age.key (install day)
#
# Adding or removing a key here changes nothing on its own: run
# `sops updatekeys hosts/maxnix/secrets.yaml` afterwards, which needs admin.
keys:
  - &admin 
  - &vm 
  - &metal 
creation_rules:
  - path_regex: hosts/maxnix/secrets\.yaml$
    key_groups:
      # One group, three keys: any ONE of them decrypts. A second group, or
      # a `-` before `age`, would make sops demand one key from each group.
      - age:
          - *admin
          - *vm
          - *metal
